name: Release asset

# Attaches a zip of the integration folder to every published release.
# HACS downloads this file (hacs.json: zip_release + filename), and GitHub
# counts the asset downloads, which HACS shows as the download number.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build venus_surplus.zip (integration files at the archive root)
        run: |
          cd custom_components/venus_surplus
          zip -r ../../venus_surplus.zip . -x '*/__pycache__/*' '__pycache__/*' '*.pyc'
          cd ../..
          unzip -l venus_surplus.zip | head -20

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" venus_surplus.zip --clobber
