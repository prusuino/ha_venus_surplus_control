rules:
  # Bronze
  action-setup:
    status: exempt
    comment: No actions; the manual commands are button entities.
  appropriate-polling:
    status: exempt
    comment: No polling; the controller reacts to the configured entities every tick (15 to 120 s).
  brands: done
  common-modules:
    status: done
    comment: engine.py (pure decision logic), controller.py and entity.py hold the shared pieces.
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency:
    status: done
    comment: No requirements.
  docs-actions:
    status: exempt
    comment: No actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data:
    status: done
    comment: The entry's controller is entry.runtime_data.
  test-before-configure:
    status: exempt
    comment: The setup picks local entities; there is nothing to connect to.
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: One entry per Venus, keyed by its force-mode entity.

  # Silver
  action-exceptions:
    status: exempt
    comment: No actions.
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: exempt
    comment: No polling platform.
  reauthentication-flow:
    status: exempt
    comment: No credentials.
  test-coverage: todo

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: exempt
    comment: Works on entities of another integration; nothing to discover.
  discovery-update-info:
    status: exempt
    comment: No discovery.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: One device per entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: todo
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Every setting is an option of the entry (Configure).
  repair-issues: done
  stale-devices:
    status: exempt
    comment: One device per entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: No web requests.
  strict-typing: todo
